                desc: "Medial and Lateral Collateral Ligaments on the inside and outside of the knee.",
                function: "Stops the knee joint from buckling sideways.",
                maintenance: `<strong>Maintenance:</strong> Single-leg dumbbell deadlifts (proprioceptive balance training). <a href="https://www.youtube.com/results?search_query=single+leg+deadlift+balance+short" target="_blank" class="inline-flex items-center text-emerald-400 hover:text-emerald-300 ml-1 font-bold">🎥 Watch Demo</a>`,
                diagnostic: "Press directly on the joint line exactly on the inside (MCL) or outside (LCL) of the knee. Tenderness directly on the joint line indicates ligament stress."
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('component-list');
            
            hardwareDatabase.forEach((item, index) => {
                const button = document.createElement('button');
                button.id = `btn-${index}`;
                button.className = 'hardware-btn w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-gray-300 border-l-4 border-transparent focus:outline-none';
                button.innerHTML = `
                    <span class="font-bold block text-white">${item.name}</span>
                    <span class="text-[10px] text-gray-500 uppercase tracking-wider">${item.category}</span>
                `;
                button.onclick = () => loadComponent(index, button);
                listContainer.appendChild(button);
            });

            document.querySelectorAll('[data-index]').forEach(element => {
                element.addEventListener('click', (e) => {
                    const index = parseInt(e.currentTarget.getAttribute('data-index'));
                    const targetBtn = document.getElementById(`btn-${index}`);
                    targetBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    loadComponent(index, targetBtn);
                });
            });
        });

        function switchMobileTab(targetId) {
            if (window.innerWidth >= 1024) return; 

            ['col-index', 'col-diagram', 'col-readout'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('flex');
                el.classList.add('hidden');
            });
            
            const targetEl = document.getElementById(targetId);
            targetEl.classList.remove('hidden');
            targetEl.classList.add('flex');

            ['col-index', 'col-diagram', 'col-readout'].forEach(id => {
                const tab = document.getElementById(`tab-${id}`);
                tab.classList.remove('bg-gray-800', 'text-emerald-400', 'border', 'border-gray-700');
                tab.classList.add('text-gray-500');
            });
            const activeTab = document.getElementById(`tab-${targetId}`);
            activeTab.classList.remove('text-gray-500');
            activeTab.classList.add('bg-gray-800', 'text-emerald-400', 'border', 'border-gray-700');
        }

        function loadComponent(index, buttonElement) {
            const data = hardwareDatabase[index];
            
            switchMobileTab('col-readout');
            
            document.getElementById('default-state').classList.add('hidden');
            const activeState = document.getElementById('active-state');
            activeState.classList.remove('hidden');
            
            activeState.classList.remove('fade-in');
            void activeState.offsetWidth;
            activeState.classList.add('fade-in');

            document.querySelectorAll('.hardware-btn').forEach(btn => {
                btn.classList.remove('active-btn');
            });
            if (buttonElement) {
                buttonElement.classList.add('active-btn');
            }

            document.querySelectorAll('[data-index]').forEach(el => {
                const elIndex = parseInt(el.getAttribute('data-index'));
                
                const isActive = (elIndex === index) || 
                                 (index === 0 && [1, 2, 3, 4].includes(elIndex)) ||
                                 (index === 5 && [6, 7].includes(elIndex));
                                 
                if (isActive) {
                    el.classList.add('active-part');
                    Array.from(el.children).forEach(child => child.classList.add('active-part'));
                } else {
                    el.classList.remove('active-part');
                    Array.from(el.children).forEach(child => child.classList.remove('active-part'));
                }
            });

            document.getElementById('readout-category').innerText = data.category;
            document.getElementById('readout-title').innerText = data.name;
            document.getElementById('readout-desc').innerText = data.desc;
            document.getElementById('readout-function').innerText = data.function;
            document.getElementById('readout-diagnostic').innerHTML = data.diagnostic;
            document.getElementById('readout-maintenance').innerHTML = data.maintenance;
        }
    </script>
</body>
</html>
